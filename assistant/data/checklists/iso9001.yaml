# AuditReady checklist pack - ISO 9001:2015 (synthetic, own-worded criteria)
#
# IMPORTANT: These criteria are original paraphrases written for this project.
# No ISO standard text is reproduced. Users of the engine bring their own
# licensed criteria (see docs/ARCHITECTURE.md §6).
#
# Schema per control:
#   control_id            unique, stable identifier
#   standard / clause     which standard + clause this maps to
#   title                 short human name
#   description           what the control asks for, in our own words
#   expected_evidence     artifact types that can satisfy it
#   sufficiency_rubric    what "good enough" means - SPECIFIC, machine-judgeable
#   citation_required     verdict must cite specific artifact(s)
#   severity              major | minor - weighting for the coverage report

pack:
  id: iso9001-sample
  standard: "ISO 9001:2015"
  version: "0.1.1"   # 0.1.1 - 8.2.1 (c) must originate with the client; an outbound
                     #         "we are done" email is (b), not (c). The model read
                     #         EML-2009 as client acknowledgement and finalized a
                     #         planted partial as satisfied (TCK-1015, 2026-09-11).
  description: >
    Sample audit-readiness pack for service-ticket records. Covers the
    record-based, reasoning-checkable subset of ISO 9001 relevant to an
    IT services organisation.

controls:
  - control_id: "ISO9001-8.2.1-client-comm"
    standard: "ISO 9001:2015"
    clause: "8.2.1"
    title: "Customer communication"
    description: >
      Evidence that the customer was informed of, and agreed to, the
      resolution before the service request was closed.
    expected_evidence:
      - ticket_resolution_comment
      - client_email_thread
      - approval_or_signoff_record
    sufficiency_rubric: >
      In scope only for tickets raised by or on behalf of an external
      client; tickets raised internally (e.g. by internal monitoring or
      staff) with no client-facing commitment = NOT APPLICABLE.
      Satisfied only if: (a) a resolution comment exists AND (b) at least one
      logged client communication precedes closure - a client email, or a
      ticket comment recording that the client was contacted, both count -
      AND (c) explicit client acknowledgement or sign-off is recorded.
      Condition (c) must ORIGINATE WITH THE CLIENT: a reply, an approval, or
      a comment recording that the client confirmed. A message from the
      provider telling the client the work is done is condition (b), never
      condition (c), however definite it sounds, and an invitation such as
      "let me know if you see anything further" is the absence of
      acknowledgement rather than evidence of it.
      (a) and (b) present but no recorded client acknowledgement = PARTIAL.
      A resolution comment alone = PARTIAL. No client communication at
      all = GAP.
    citation_required: true
    severity: "major"

  - control_id: "ISO9001-8.6-release-signoff"
    standard: "ISO 9001:2015"
    clause: "8.6"
    title: "Release sign-off before closure"
    description: >
      Evidence that an authorised person approved the release/closure of the
      work before the ticket was closed.
    expected_evidence:
      - approval_or_signoff_record
      - signoff_email
      - ticket_approval_field
    sufficiency_rubric: >
      Satisfied only if a named, authorised approver and an approval timestamp
      that precedes ticket closure are both recorded. An unnamed "approved"
      note = PARTIAL. No approval record = GAP.
    citation_required: true
    severity: "major"

  - control_id: "ISO9001-8.5.2-traceability"
    standard: "ISO 9001:2015"
    clause: "8.5.2"
    title: "Identification and traceability"
    description: >
      Records must be identifiable and traceable: the ticket links to the
      change records, emails, or artifacts it references, and those artifacts
      exist.
    expected_evidence:
      - linked_change_record
      - linked_email
      - artifact_reference
    sufficiency_rubric: >
      Satisfied only if every artifact the ticket's resolution references
      (change IDs, emails, documents) is present in the record set and
      resolvable. A reference to a missing/non-existent artifact = GAP.
      Unreferenced but incomplete links = PARTIAL.
    citation_required: true
    severity: "major"

  - control_id: "ISO9001-8.7-nonconforming-output"
    standard: "ISO 9001:2015"
    clause: "8.7"
    title: "Control of nonconforming outputs"
    description: >
      When delivered work is found defective or nonconforming, the record shows
      it was contained/corrected and any concession (accept-as-is) was
      explicitly authorised by the customer.
    expected_evidence:
      - defect_or_incident_record
      - correction_comment
      - customer_concession_record
    sufficiency_rubric: >
      Satisfied only if the nonconformity is described AND the action taken
      (correction, rework, or authorised concession) is recorded. Shipping a
      known-defective output with no documented concession = GAP. Correction
      recorded but no verification of the fix = PARTIAL.
    citation_required: true
    severity: "major"

  - control_id: "ISO9001-10.2-corrective-action"
    standard: "ISO 9001:2015"
    clause: "10.2"
    title: "Nonconformity and corrective action"
    description: >
      For incidents/problems, the record shows a root-cause analysis and a
      corrective action to prevent recurrence - not just a fix.
    expected_evidence:
      - root_cause_analysis_comment
      - corrective_action_record
      - problem_ticket_link
    sufficiency_rubric: >
      Satisfied only if (a) a root cause is explicitly stated AND (b) a
      corrective/preventive action beyond the immediate fix is recorded.
      Immediate fix documented but no root cause = GAP for incidents marked
      severity high; PARTIAL otherwise.
    citation_required: true
    severity: "major"

  - control_id: "ISO9001-7.5-documented-info"
    standard: "ISO 9001:2015"
    clause: "7.5.3"
    title: "Control of documented information"
    description: >
      Closed tickets must be complete records: description, resolution,
      dates, and responsible persons all present and consistent.
    expected_evidence:
      - ticket_resolution_comment
      - complete_ticket_fields
    sufficiency_rubric: >
      Satisfied only if the closed ticket has a non-empty description, a
      non-empty resolution, closure date >= creation date, and a named
      assignee. A closed ticket with an empty resolution = GAP. Missing
      non-critical fields = PARTIAL.
    citation_required: true
    severity: "minor"

  - control_id: "ISO9001-8.2.3-requirements-review"
    standard: "ISO 9001:2015"
    clause: "8.2.3"
    title: "Review of requirements before commitment"
    description: >
      Before work on a request begins, the record shows the requirement/scope
      was reviewed and confirmed with the customer.
    expected_evidence:
      - scope_confirmation_comment
      - client_email_thread
      - requirement_reference
    sufficiency_rubric: >
      Satisfied only if a scope/requirement confirmation (comment or email)
      exists and is dated before substantive work comments. Work started with
      no recorded requirement confirmation = GAP. Confirmation recorded after
      work began = PARTIAL.
    citation_required: true
    severity: "minor"

  - control_id: "ISO9001-8.5.6-change-control"
    standard: "ISO 9001:2015"
    clause: "8.5.6"
    title: "Control of changes"
    description: >
      Production/service changes must show review and approval before
      implementation, including who approved and when.
    expected_evidence:
      - change_approval_record
      - cab_review_comment
      - approval_or_signoff_record
    sufficiency_rubric: >
      The approval assessed here is the CHANGE approval - a change-record
      approver, a CAB review comment, or an explicit authorisation to
      deploy. A ticket closure sign-off is NOT a change approval and its
      timing is irrelevant to this control. Satisfied only if a named
      change approver and an approval timestamp exist and precede the
      implementation/deployment. Change deployed with the change approval
      recorded only afterwards = PARTIAL. No change approval record at
      all = GAP.
    citation_required: true
    severity: "major"

  - control_id: "ISO9001-9.1.2-customer-satisfaction"
    standard: "ISO 9001:2015"
    clause: "9.1.2"
    title: "Monitoring customer satisfaction"
    description: >
      Customer feedback (positive or complaint) is captured, and complaints
      show a recorded follow-up.
    expected_evidence:
      - satisfaction_survey_record
      - feedback_comment
      - complaint_followup_record
    sufficiency_rubric: >
      For tickets with feedback requested: satisfied if a survey/feedback
      record exists. For tickets containing a complaint: satisfied only if a
      follow-up action is recorded; complaint with no recorded follow-up = GAP.
      Tickets with no feedback interaction are NOT in scope for this control.
    citation_required: true
    severity: "minor"
