<svg viewBox="0 0 1140 700" role="img" aria-label="LLM call map: judge, v2 LangGraph nodes, RAG decomposition and the eval harness all reach the model through core/llm.py chat(); untrusted records pass input guardrails before the call and a citation check after it; the LangChain agent alone holds its own handle to OpenRouter; embeddings are local and never call a provider; a BYO endpoint replaces OpenRouter by env vars." xmlns="http://www.w3.org/2000/svg">
<title>AuditReady LLM call map</title>
<style>
.t,.tt,.tb,.lbl,.al{font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1B2430}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.tb{fill:#4A5563}.lbl{fill:#6B7480;letter-spacing:.08em;font-weight:600}.al{fill:#4A5563;font-style:italic}
.bx{stroke-width:1.2}
.bx.built{fill:#E3F3EC;stroke:#0F6E56}.bx.v2{fill:#E4EEF9;stroke:#185FA5}
.bx.roadmap{fill:none;stroke:#6B7480;stroke-dasharray:5 4}.bx.guard{fill:#FBEBDD;stroke:#B4540A}
.bx.ink{fill:#F3F5F7;stroke:#1B2430}.bx.core{fill:#FFFFFF;stroke:#0F6E56;stroke-width:1.6}
.bnd{fill:none;stroke:#1B2430;stroke-width:1.2;stroke-dasharray:8 6}
.ar{fill:none;stroke:#1B2430;stroke-width:1.3;color:#1B2430}
.ar.v2{stroke:#185FA5;color:#185FA5}.ar.roadmap{stroke:#6B7480;color:#6B7480}
.ar.guard{stroke:#B4540A;color:#B4540A}.ar.dash{stroke-dasharray:5 4}
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20" y="30" class="lbl" text-anchor="start" font-size="10">WHO CALLS THE MODEL</text>
<text x="300" y="30" class="lbl" text-anchor="start" font-size="10">BEFORE AND AFTER THE MODEL</text>
<text x="530" y="30" class="lbl" text-anchor="start" font-size="10">THE ONE DOOR</text>
<text x="830" y="30" class="lbl" text-anchor="start" font-size="10">PROVIDERS</text>
<rect x="20" y="44" width="250" height="72" rx="4" class="bx built"/>
<text x="30" y="65" class="tt" text-anchor="start" font-weight="600" font-size="12">judge.py · judge_ticket()</text>
<text x="30" y="79" class="tb" text-anchor="start" font-size="10">rubric + fenced record →</text>
<text x="30" y="93" class="tb" text-anchor="start" font-size="10">Verdict satisfied | partial | gap | n/a</text>
<text x="30" y="107" class="tb" text-anchor="start" font-size="10">+ rationale + citations, schema-validated</text>
<rect x="20" y="130" width="250" height="72" rx="4" class="bx v2"/>
<text x="30" y="151" class="tt" text-anchor="start" font-weight="600" font-size="12">audit/ LangGraph nodes</text>
<text x="30" y="165" class="tb" text-anchor="start" font-size="10">judge node reuses judge_ticket</text>
<text x="30" y="179" class="tb" text-anchor="start" font-size="10">draft remediation · self-verify citation</text>
<text x="30" y="193" class="tb" text-anchor="start" font-size="10">branch on verdict</text>
<rect x="20" y="350" width="250" height="60" rx="4" class="bx built"/>
<text x="30" y="371" class="tt" text-anchor="start" font-weight="600" font-size="12">rag.py · decompose_control()</text>
<text x="30" y="385" class="tb" text-anchor="start" font-size="10">rubric → 2–6 evidence sub-queries</text>
<text x="30" y="399" class="tb" text-anchor="start" font-size="10">cached per control, double-checked lock</text>
<rect x="20" y="424" width="250" height="60" rx="4" class="bx built"/>
<text x="30" y="445" class="tt" text-anchor="start" font-weight="600" font-size="12">assistant/eval/run_eval.py</text>
<text x="30" y="459" class="tb" text-anchor="start" font-size="10">LLM-as-judge: faithfulness, correctness</text>
<text x="30" y="473" class="tb" text-anchor="start" font-size="10">same model → self-grading bias, noted</text>
<rect x="20" y="498" width="250" height="72" rx="4" class="bx built"/>
<text x="30" y="519" class="tt" text-anchor="start" font-weight="600" font-size="12">assistant/agent.py · LangChain</text>
<text x="30" y="533" class="tb" text-anchor="start" font-size="10">own ChatOpenAI handle: bind_tools,</text>
<text x="30" y="547" class="tb" text-anchor="start" font-size="10">hand-written loop capped at 6 rounds,</text>
<text x="30" y="561" class="tb" text-anchor="start" font-size="10">sliding window of 40 messages</text>
<rect x="20" y="600" width="250" height="72" rx="4" class="bx built"/>
<text x="30" y="621" class="tt" text-anchor="start" font-weight="600" font-size="12">retrieval.py · embeddings</text>
<text x="30" y="635" class="tb" text-anchor="start" font-size="10">NOT an LLM call: all-MiniLM-L6-v2,</text>
<text x="30" y="649" class="tb" text-anchor="start" font-size="10">384-dim, local CPU — corpus text</text>
<text x="30" y="663" class="tb" text-anchor="start" font-size="10">never leaves the machine</text>
<rect x="300" y="612" width="200" height="48" rx="4" class="bx built"/>
<text x="310" y="633" class="tt" text-anchor="start" font-weight="600" font-size="12">Chroma (local)</text>
<text x="310" y="647" class="tb" text-anchor="start" font-size="10">embed on ingest and on search</text>
<polyline points="270,636 298,636" class="ar ink" marker-end="url(#ah)"/>
<rect x="300" y="44" width="200" height="148" rx="4" class="bx guard"/>
<text x="310" y="65" class="tt" text-anchor="start" font-weight="600" font-size="12">Guardrails · in</text>
<text x="310" y="79" class="tb" text-anchor="start" font-size="10">L1 prompt: system prompt says the</text>
<text x="310" y="93" class="tb" text-anchor="start" font-size="10">record is DATA · &lt;&lt;&lt;RECORD fence</text>
<text x="310" y="107" class="tb" text-anchor="start" font-size="10">L2 content: scan_injection +</text>
<text x="310" y="121" class="tb" text-anchor="start" font-size="10">sanitize_record quarantine the</text>
<text x="310" y="135" class="tb" text-anchor="start" font-size="10">payload before any token is spent</text>
<text x="310" y="149" class="tb" text-anchor="start" font-size="10">validate_user_input: 4000-char cap</text>
<rect x="300" y="204" width="200" height="92" rx="4" class="bx guard"/>
<text x="310" y="225" class="tt" text-anchor="start" font-weight="600" font-size="12">Guardrails · out</text>
<text x="310" y="239" class="tb" text-anchor="start" font-size="10">L3 check_citations: every citation</text>
<text x="310" y="253" class="tb" text-anchor="start" font-size="10">must resolve to a real artifact.</text>
<text x="310" y="267" class="tb" text-anchor="start" font-size="10">No citation, no verdict — back to</text>
<text x="310" y="281" class="tb" text-anchor="start" font-size="10">judge_ticket / the verify node.</text>
<text x="300" y="318" class="tb" text-anchor="start" font-size="10">TCK-1010&#x27;s planted payload is the</text>
<text x="300" y="332" class="tb" text-anchor="start" font-size="10">standing test: quarantined, never obeyed.</text>
<rect x="530" y="44" width="250" height="400" rx="4" class="bx built"/>
<text x="540" y="65" class="tt" text-anchor="start" font-weight="600" font-size="12">core/llm.py · chat()</text>
<text x="540" y="79" class="tb" text-anchor="start" font-size="10">model = AUDITREADY_MODEL env</text>
<text x="540" y="93" class="tb" text-anchor="start" font-size="10">temperature 0 — verdicts must repeat</text>
<text x="540" y="107" class="tb" text-anchor="start" font-size="10">3 attempts, backoff 2s / 4s / 8s, only on</text>
<text x="540" y="121" class="tb" text-anchor="start" font-size="10">rate-limit · timeout · connection</text>
<text x="540" y="135" class="tb" text-anchor="start" font-size="10">auth and bad-request fail at once</text>
<text x="540" y="149" class="tb" text-anchor="start" font-size="10">one LLMError, user-safe message</text>
<text x="540" y="163" class="tb" text-anchor="start" font-size="10">returns ChatResult with token counts</text>
<text x="540" y="177" class="tb" text-anchor="start" font-size="10">lazy client · thread-safe holder</text>
<text x="540" y="428" class="al" text-anchor="start" font-size="10">Every arrow into this bar is one chat() call.</text>
<polyline points="270,80 298,80" class="ar guard" marker-end="url(#ah)"/>
<polyline points="270,166 298,166" class="ar guard" marker-end="url(#ah)"/>
<polyline points="500,118 528,118" class="ar guard" marker-end="url(#ah)"/>
<polyline points="530,250 502,250" class="ar guard" marker-end="url(#ah)"/>
<polyline points="270,380 528,380" class="ar ink" marker-end="url(#ah)"/>
<text x="399" y="372" class="al" text-anchor="middle" font-size="10">trusted rubric, no record</text>
<polyline points="270,454 528,454" class="ar ink" marker-end="url(#ah)"/>
<text x="399" y="446" class="al" text-anchor="middle" font-size="10">judge prompts over saved outputs</text>
<rect x="830" y="44" width="290" height="90" rx="4" class="bx built"/>
<text x="840" y="65" class="tt" text-anchor="start" font-weight="600" font-size="12">OpenRouter</text>
<text x="840" y="79" class="tb" text-anchor="start" font-size="10">https://openrouter.ai/api/v1</text>
<text x="840" y="93" class="tb" text-anchor="start" font-size="10">OpenAI wire protocol via the openai SDK</text>
<text x="840" y="107" class="tb" text-anchor="start" font-size="10">default model openai/gpt-4o-mini</text>
<rect x="830" y="152" width="290" height="50" rx="4" class="bx built"/>
<text x="840" y="173" class="tt" text-anchor="start" font-weight="600" font-size="12">OpenRouter pricing endpoint</text>
<text x="840" y="187" class="tb" text-anchor="start" font-size="10">GET /models → per-token USD · offline fallback</text>
<rect x="830" y="222" width="290" height="90" rx="4" class="bx v2"/>
<text x="840" y="243" class="tt" text-anchor="start" font-weight="600" font-size="12">BYO endpoint (CR-4)</text>
<text x="840" y="257" class="tb" text-anchor="start" font-size="10">Azure OpenAI in the customer&#x27;s tenant,</text>
<text x="840" y="271" class="tb" text-anchor="start" font-size="10">or a local model (Ollama / vLLM)</text>
<text x="840" y="285" class="tb" text-anchor="start" font-size="10">same call · switch = base_url + key env vars</text>
<rect x="830" y="330" width="290" height="56" rx="4" class="bx built"/>
<text x="840" y="351" class="tt" text-anchor="start" font-weight="600" font-size="12">ChatResult tokens → cost per turn</text>
<text x="840" y="365" class="tb" text-anchor="start" font-size="10">prompt + completion tokens × live pricing (FR-17)</text>
<polyline points="780,90 828,90" class="ar ink" marker-end="url(#ah)"/>
<polyline points="780,177 828,177" class="ar ink" marker-end="url(#ah)"/>
<polyline points="780,266 828,266" class="ar v2" marker-end="url(#ah)"/>
<polyline points="780,358 828,358" class="ar ink" marker-end="url(#ah)"/>
<polyline points="270,534 1132,534 1132,90 1122,90" class="ar ink" marker-end="url(#ah)"/>
<text x="700" y="524" class="al" text-anchor="middle" font-size="10">bypasses chat(): LangChain&#x27;s own ChatOpenAI handle to the same OpenRouter key · temperature 0</text>
</svg>