<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Two surfaces, a chat assistant (v1) and an audit engine with reports (v2), both sit on one shared core of domain tools, advanced RAG, and guardrails, which sits on a data layer of vector store, checklist packs, and evidence corpus, and calls an external LLM via OpenRouter.</desc>
