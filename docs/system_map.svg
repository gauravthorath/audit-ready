<svg viewBox="0 0 1140 790" role="img" aria-label="AuditReady system map: a compliance manager uses Streamlit surfaces that drive a LangGraph agent, batch runner and LangChain agent, all calling one framework-free core over a Chroma store, YAML checklist packs and a synthetic corpus, inside a self-hosted boundary; evidence enters through MCP connectors, the model is reached through core/llm.py to OpenRouter or a BYO endpoint, and a hosted product website with social sign-in is on the roadmap." xmlns="http://www.w3.org/2000/svg">
<title>AuditReady system map</title>
